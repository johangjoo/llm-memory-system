[project]
name = "llm-memory-system"
version = "0.1.0"
requires-python = "==3.12.10"
dependencies = [
  "python-dotenv==1.1.1",
  "fastapi==0.135.3",
  "uvicorn==0.43.0",
  "psycopg[binary]==3.2.3",
  "psycopg_pool==3.2.4",
  "pgvector==0.3.6",
  "openai==2.33.0",
  "numpy==2.4.3",
  "pydantic==2.12.5",
  "tzdata==2025.3"
]

[project.optional-dependencies]
eval = ["websockets==15.0.1"]
mem0 = ["websockets==15.0.1", "mem0ai==2.0.4"]
dev = ["websockets==15.0.1", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*", "src*", "eval*"]

[tool.setuptools.package-data]
server = ["schema.sql", "migrations/*.sql", "fixtures/*.json"]
